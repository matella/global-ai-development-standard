name: GADS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify manifest
        run: python scripts/verify_manifest.py
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository audit
        run: python scripts/repo_audit.py .
      - name: Release gate rejects the unfilled example
        run: |
          if python scripts/release_gate.py scripts/example-release-report.json; then
            echo "expected the unfilled example report to fail"
            exit 1
          fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # Pinned by version; Dependabot does not update these.
      - name: Install linters
        run: |
          python -m pip install ruff==0.17.1
          npm install --global --ignore-scripts markdownlint-cli2@0.23.3
      - name: Python lint
        run: ruff check .
      - name: Markdown lint
        run: markdownlint-cli2 "**/*.md"
